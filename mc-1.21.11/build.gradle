plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

def mcVersion = '1.21.11'

version = "${mod_version}+${mcVersion}"
group = maven_group
base { archivesName = archives_base_name }

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
}

processResources {
    def resourceProperties = [
        version: project.version,
        minecraft_version: mcVersion,
        java_version: 21
    ]
    inputs.properties resourceProperties
    filesMatching(['fabric.mod.json', 'mcci-cloak-hider.mixins.json']) {
        expand resourceProperties
    }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
